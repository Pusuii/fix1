{% extends "base.html" %}
{% block title %}Pendaftaran ditutup · {{ app_name }}{% endblock %}
{% block body %}
<main style="min-height:100vh;display:grid;place-items:center;padding:2rem;">
  <div style="max-width:460px;text-align:center;">
    <img src="{{ url_for('static', filename='img/logo-color.png') }}" alt="" width="84" style="margin:0 auto 1.25rem;">
    <h1 style="margin-bottom:.7rem;">Pendaftaran sedang ditutup</h1>
    <p class="muted">Saat ini {{ app_name }} tidak menerima akun baru. Hubungi {{ cfg.support_email }} bila Anda perlu dibuatkan akun.</p>
    <a class="btn primary" href="{{ url_for('auth.login') }}">Masuk</a>
  </div>
</main>
{% endblock %}
